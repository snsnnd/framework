[project]
name = "efw-studio-core"
version = "0.1.0"
description = "EFW local project service and C application generator"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
packaging = ["pyinstaller>=6.12,<7"]
# agent 接入用的 MCP server；只有跑 -m studio_core.mcp 时才需要
agent = ["mcp>=1.2"]

[tool.uv]
package = false
